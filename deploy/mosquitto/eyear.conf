# /etc/mosquitto/conf.d/eyear.conf
# 1883: 바깥(Node 노트북·팀원)용, 아이디·비밀번호 필요. 비밀번호 파일은 서버에서 직접 만든다 (레포에 넣지 않음):
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd eyear && sudo chown mosquitto: /etc/mosquitto/passwd && sudo chmod 600 /etc/mosquitto/passwd
# 1884: 서버 안 전용(127.0.0.1), 비밀번호 없음. 중앙·월드모델·가전 시뮬레이터가 MQTT 로그인을 지원하지 않아서.
per_listener_settings true
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
listener 1884 127.0.0.1
allow_anonymous true
